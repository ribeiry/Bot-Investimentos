services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_automation
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/New_York
      - WEBHOOK_URL=https://broaden-spew-parakeet.ngrok-free.dev
      - TZ=America/Sao_Paulo
    networks:
      - portfolio-network
    volumes:
      - n8n_data:/home/node/.n8n
  portifolio-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Sao_Paulo
      - API_KEY=${API_KEY}
      - BRAPI_TOKEN=${BRAPI_TOKEN}
      - ALPHA_KEY=${ALPHA_KEY}
      - TWELVE_DATA_KEY=${TWELVE_DATA_KEY}
    networks:
      - portfolio-network
    volumes:
      - sqlite-data:/root/data
volumes:
  n8n_data:
  sqlite-data:
networks:
  portfolio-network:
    driver: bridge